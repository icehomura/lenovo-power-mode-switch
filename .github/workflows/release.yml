name: Release

# Builds the Windows x86-64 installer and attaches it to a GitHub Release.
#
# Pushing a `v*` tag is the normal path:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The manual trigger exists for re-cutting a release from an existing tag
# without pushing a new commit.
#
# macOS and Linux are deliberately absent — see build.yml for why.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Windows x86-64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: List installer
        shell: bash
        run: ls -l src-tauri/target/release/bundle/nsis/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Lenovo Power Mode Switch ${{ steps.tag.outputs.tag }}"
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: true
          generate_release_notes: true
