name: Build

# Continuous integration for the Windows x86-64 target only. macOS and Linux are
# deliberately absent: the app drives Lenovo's Windows-only PowerBattery /
# IdeaNotebookAddin native layer through a C++/CLI mixed-mode DLL, so it cannot
# be built or run anywhere else.
#
# Tags are handled by release.yml, so this workflow runs on branches only.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x86-64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          # There is no workspace at the repository root; Cargo lives in src-tauri.
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # `pnpm tauri build` runs the configured beforeBuildCommand, which type
      # checks the frontend (vue-tsc) and then bundles it with Vite.
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
